# Blueprint do Render para a loja INFLEXO (monorepo npm: apps/web importa packages/ e pipeline/output).
# Segredos ficam com sync:false: o Render pergunta o valor no painel, nada de chave no Git.
services:
  - type: web
    name: inflexo
    runtime: node
    region: oregon
    plan: free            # dorme após ~15 min sem visita; trocar para starter quando a venda abrir
    branch: main
    # --include=dev: o Next precisa do TypeScript e dos tipos para compilar, mesmo com NODE_ENV=production
    buildCommand: npm ci --include=dev && npm run build -w @inflexo/web
    startCommand: npm run start -w @inflexo/web
    healthCheckPath: /metodo
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # pagamento (Stripe). A compra só aparece com CHECKOUT_ATIVO=true; sem ele a loja fica só com a fila.
      - key: STRIPE_SECRET_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CHECKOUT_ATIVO
        value: "false"
      - key: SITE_URL
        value: https://inflexo.com.br
      # pós-pagamento (EXP-317): fila de tarefas, e-mail e fornecedores
      - key: TAREFAS_SEGREDO
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        value: INFLEXO <pedidos@inflexo.com.br>
      - key: GELATO_API_KEY
        sync: false
